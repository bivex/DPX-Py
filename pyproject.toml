[project]
name = "dpx-py"
version = "0.1.0"
description = "Design Patterns X for Python (3.8 - 3.13+) - Multi-Paradigm Hexagonal Pattern Detector & Data Flow Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.10.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
]

[project.scripts]
pattern-detector = "pattern_detector.adapters.inbound.cli.main:main"
dpx = "pattern_detector.adapters.inbound.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pattern_detector"]

[dependency-groups]
dev = [
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
